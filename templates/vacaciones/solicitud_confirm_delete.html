{% extends "base.html" %}

{% block content %}
<h1>Eliminar solicitud</h1>
<p>¿Seguro que querés eliminar la solicitud de {{ solicitud.empleado.username }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Eliminar</button>
    <a class="btn btn-secondary" href="{% url 'vacaciones:detalle' solicitud.pk %}">Cancelar</a>
</form>
{% endblock %}
